<!DOCTYPE html>
<html>
<head>
  <style>
    html, body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #000;
    overflow: hidden;
}

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      position: absolute;
      top: 0;
      left: 0;
    }

    #my_player {
      width: 100%;
      height: 100vh; /* Full viewport height */
    }

    #backButton {
      position: absolute;
      top: 15px;
      left: 15px;
      background-color: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      padding: 10px;
      cursor: pointer;
      z-index: 1000;
    }

    #backButton:hover {
      background-color: rgba(0, 0, 0, 0.8);
    }

    .fullscreen-active #backButton {
      display: none;
    }
  </style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>
<body>
  <iframe
    id="my_player"
    src="https://Chull .tv/unviiplayer.html?url=https://bitdash-a.akamaihd.net/content/sintel/hls/playlist.m3u8"
    allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
    allowfullscreen>
  </iframe>

  <script>
    document.addEventListener("fullscreenchange", function () {
      if (document.fullscreenElement) {
        document.body.classList.add('fullscreen-active');
      } else {
        document.body.classList.remove('fullscreen-active');
      }
    });
  </script>
</body>
</html>
